plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = '1.1.4-1.21.1-neoforge'
group = 'com.tom.hqspeaker'

base {
    archivesName = 'hqspeaker'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { name = 'CC: Tweaked'; url = 'https://maven.squiddev.cc' }
}

neoForge {
    version = providers.gradleProperty('neoForgeVersion').getOrElse('21.1.247')

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'forge.logging.console.level', 'info'
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            systemProperty 'forge.logging.console.level', 'info'
        }
    }

    mods {
        hqspeaker {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation 'cc.tweaked:cc-tweaked-1.21.1-forge:1.120.0'

    // Keep the supported Jar-in-Jar ranges, but prefer the exact versions this project has tested and packages.
    // Supplying an exact preferred dependency avoids dynamic version-list resolution while preserving negotiation metadata.
    jarJar(implementation('com.googlecode.soundlibs:mp3spi:1.9.5.4')) {
        version {
            strictly '[1.9.5.4,1.9.6)'
            prefer '1.9.5.4'
        }
    }
    jarJar(implementation('com.googlecode.soundlibs:jlayer:1.0.1.4')) {
        version {
            strictly '[1.0.1.4,1.0.2)'
            prefer '1.0.1.4'
        }
    }
    jarJar(implementation('com.googlecode.soundlibs:tritonus-share:0.3.7.4')) {
        version {
            strictly '[0.3.7.4,0.3.8)'
            prefer '0.3.7.4'
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Specification-Title': 'HQSpeaker',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': version,
            'Implementation-Vendor': 'HQSpeaker'
        )
    }
}
