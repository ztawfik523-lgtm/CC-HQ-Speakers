plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = '1.1.4-1.21.1-neoforge'
group = 'com.tom.hqspeaker'

base {
    archivesName = 'hqspeaker'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { name = 'CC: Tweaked'; url = 'https://maven.squiddev.cc' }
    exclusiveContent {
        forRepository {
            maven { name = 'Sable Companion'; url = 'https://maven.ryanhcode.dev/releases' }
        }
        filter {
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
}

neoForge {
    version = providers.gradleProperty('neoForgeVersion').getOrElse('21.1.247')

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'forge.logging.console.level', 'info'
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            systemProperty 'forge.logging.console.level', 'info'
        }
    }

    mods {
        hqspeaker {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation 'cc.tweaked:cc-tweaked-1.21.1-forge:1.120.0'

    // Lightweight moving-sublevel compatibility. Safe default behavior is used when Sable is absent.
    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sableCompanionVersion}")) {
        version {
            strictly "[${sableCompanionVersion},1.7.0)"
            prefer sableCompanionVersion
        }
    }

    // JLayer is used directly by the modern progressive MP3 decoder and supported MP3/ICY radio streaming.
    jarJar(implementation('com.googlecode.soundlibs:jlayer:1.0.1.4')) {
        version {
            strictly '[1.0.1.4,1.0.2)'
            prefer '1.0.1.4'
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'cc.tweaked:cobalt:0.9.9'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Specification-Title': 'HQSpeaker',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': version,
            'Implementation-Vendor': 'HQSpeaker'
        )
    }
}
