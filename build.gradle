plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = '1.1.4-1.21.1-neoforge'
group = 'com.tom.hqspeaker'

base {
    archivesName = 'hqspeaker'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { name = 'CC: Tweaked'; url = 'https://maven.squiddev.cc' }
}

neoForge {
    version = '21.1.211'

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'forge.logging.console.level', 'info'
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            systemProperty 'forge.logging.console.level', 'info'
        }
    }

    mods {
        hqspeaker {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation 'cc.tweaked:cc-tweaked-1.21.1-forge:1.113.1'

    // OGG uses Minecraft/LWJGL STBVorbis; MP3/WAV use JavaSound/mp3spi.
    jarJar 'com.googlecode.soundlibs:mp3spi:[1.9.5.4,1.9.6)'
    jarJar 'com.googlecode.soundlibs:jlayer:[1.0.1.4,1.0.2)'
    jarJar 'com.googlecode.soundlibs:tritonus-share:[0.3.7.4,0.3.8)'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    implementation 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Specification-Title': 'HQSpeaker',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': version,
            'Implementation-Vendor': 'HQSpeaker'
        )
    }
}
