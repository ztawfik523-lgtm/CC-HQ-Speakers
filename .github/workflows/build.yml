name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neoforge: ["21.1.247", "21.1.248"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for NeoForge ${{ matrix.neoforge }}
        run: ./gradlew clean build -PneoForgeVersion=${{ matrix.neoforge }} --no-daemon

      - name: Verify packaged mod
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -type f -name 'hqspeaker-*.jar' | head -n 1)
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "$jar_file" | grep -Fx 'hqspeaker.mixins.json'
          jar tf "$jar_file" | grep -Fx 'META-INF/jarjar/metadata.json'
          jar tf "$jar_file" | grep -Fx 'META-INF/jarjar/mp3spi-1.9.5.4.jar'
          jar tf "$jar_file" | grep -Fx 'META-INF/jarjar/jlayer-1.0.1.4.jar'
          jar tf "$jar_file" | grep -Fx 'META-INF/jarjar/tritonus-share-0.3.7.4.jar'

      - name: Upload candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: hqspeaker-neoforge-${{ matrix.neoforge }}
          path: build/libs/hqspeaker-*.jar
          if-no-files-found: error
